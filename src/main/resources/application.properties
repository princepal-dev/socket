spring.application.name=socket-drop
 
# 50MB -> Upload & download max limit & file storage location
spring.file.max-size=52428800
spring.file.max-download-size=52428800
spring.file.base-path=storage
 
# Spring multipart safety
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

