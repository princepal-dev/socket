services:
  socket-drop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: socket-drop
    ports:
      - "8080:8080"
    environment:
      SPRING_FILE_BASE_PATH: /app/storage
      SPRING_FILE_MAX_SIZE: 52428800
      SPRING_FILE_MAX_DOWNLOAD_SIZE: 52428800
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 50MB

      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 50MB
    volumes:
      - socket_drop_storage:/app/storage
    restart: unless-stopped

volumes:
  socket_drop_storage:

